[project]
name = "trialink"
version = "0.1.0"
description = "TriaLink – párování onkologických pacientů s klinickými studiemi MOÚ"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "openai>=1.50",
    "intersystems-irispython>=5.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
