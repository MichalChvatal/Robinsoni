[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-quality-monitor"
version = "0.1.0"
description = "Local MR DICOM intake, metadata analysis and DEMO validation history"
requires-python = ">=3.12"
dependencies = [
  "pydicom>=3,<4",
  "pynetdicom>=3,<4",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]
gui = ["PySide6>=6.8,<7"]

[project.scripts]
mr-receiver = "mr_quality_monitor.cli:main"
mr-monitor = "mr_quality_monitor.gui.app:main"
mr-analysis = "mr_quality_monitor.worker_cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
